# Seed routing examples for skill description changes.
# This file is intentionally simple YAML so it can be reviewed and expanded by hand.

- query: "帮我跑一下今天的 paper digest，并发到飞书文档后通知群里"
  should_load:
    - paper-digest
  should_not_load:
    - paper-reader
    - paper-patterns

- query: "今天的 paper digest 存到 Obsidian vault，不要再发飞书文档"
  should_load:
    - paper-digest
  should_not_load:
    - paper-reader
    - paper-patterns

- query: "这篇 arxiv 论文讲什么？2401.12345"
  should_load:
    - paper-reader
  should_not_load:
    - paper-digest
    - paper-patterns

- query: "按 PaperForge 那种方式深读这篇 paper，重点讲作者怎么想到这个 idea、最脆弱假设和反例"
  should_load:
    - paper-reader
  should_not_load:
    - paper-digest
    - paper-patterns

- query: "把这篇 paper 提炼成可迁移的 problem pattern 和 solution pattern，并写进 Research Pattern OKF"
  should_load:
    - paper-patterns
  should_not_load:
    - paper-digest
    - paper-reader

- query: "从 2401.12345 抽取 bottleneck、assumption、tradeoff 和 research question，维护到 pattern library"
  should_load:
    - paper-patterns
  should_not_load:
    - paper-digest
    - paper-reader

- query: "跑 x-feed-capture，继续上次的位置，发到飞书"
  should_load:
    - x-feed-capture
  should_not_load:
    - paper-digest

- query: "继续跑 x-capture，把结果写进 obsidian vault"
  should_load:
    - x-feed-capture
  should_not_load:
    - paper-digest

- query: "这个任务适不适合做成长程工作？如果适合生成 route.md"
  should_load:
    - route-driven-work
  should_not_load:
    - prd-to-plan
    - frontier-search

- query: "帮我本地 validate 这个 serverless job，按真实 event contract 触发，云上的队列和存储先 adapter/mock"
  should_load:
    - local-production-validation
  should_not_load:
    - systematic-debugging

- query: "这个 long-running task 适不适合做成长程工作？先生成 route.md"
  should_load:
    - route-driven-work
  should_not_load:
    - local-production-validation
    - deli-autoresearch
    - frontier-search

- query: "围绕这个目标探索 SOTA 空间，组合模型、prompt、检索和评测轴，找有没有更好的 Pareto frontier"
  should_load:
    - frontier-search
  should_not_load:
    - route-driven-work
    - deli-autoresearch

- query: "先不要写固定路线，帮我定义实验轴和 candidate ledger，看看质量、成本、延迟有没有更好的 tradeoff"
  should_load:
    - frontier-search
  should_not_load:
    - route-driven-work

- query: "看这些 badcase，帮我归因 prompt 里哪些部分可能导致了这些失败，不要直接改线上 prompt"
  should_load:
    - prompt-badcase-advisor
  should_not_load:
    - frontier-search
    - programmable-doc-review

- query: "这里有 prompt.md 和一批 RPB details.jsonl，先做坏例归因和 prompt advice report"
  should_load:
    - prompt-badcase-advisor
  should_not_load:
    - route-driven-work
    - write-a-skill

- query: "帮我自动搜索一组 prompt patch，跑 benchmark 后选出胜出版本"
  should_load:
    - frontier-search
  should_not_load:
    - prompt-badcase-advisor

- query: "这批 preferred/rejected pairs 可能被长度 shortcut 学到，帮我审一下 DPO 数据怎么改"
  should_load:
    - harden-preference-data
  should_not_load:
    - prompt-badcase-advisor
    - paper-digest

- query: "继续做 preference data frontier，重点防 reward hacking 和 proxy metric gaming"
  should_load:
    - frontier-search
    - harden-preference-data
  should_not_load:
    - route-driven-work

- query: "用 Deli AutoResearch protocol 跑一个多天的无人值守研究任务，要有 state files、stall detection 和 heartbeat watchdog"
  should_load:
    - deli-autoresearch
  should_not_load:
    - route-driven-work
    - frontier-search

- query: "给这个 helper 函数补一个单测，本地跑一下"
  should_load:
    - tdd
  should_not_load:
    - local-production-validation

- query: "检查一下这个 skills 仓库，有哪些 skill 太长、description 不清楚"
  should_load:
    - skill-maintenance
  should_not_load:
    - write-a-skill

- query: "你这个 skill 老是跳过 setup step，帮我把规则沉淀进去，之后别再犯"
  should_load:
    - skill-maintenance
  should_not_load:
    - write-a-skill
    - systematic-debugging

- query: "这个 self-improving workflow skills 的思路，看看能不能吸收到现有技能仓库"
  should_load:
    - skill-maintenance
  should_not_load:
    - write-a-skill

- query: "用 gcloud 找个 L4 或 A100 spot 跑 DPO，权重提前准备好，要求可 resume 且别浪费 GPU 时间"
  should_load:
    - cloud-gpu-runner
  should_not_load:
    - frontier-search
    - local-production-validation

- query: "AWS 上开一台 G5/P4 GPU 做批量 eval，先查 spot 价格和容量，跑完自动清理"
  should_load:
    - cloud-gpu-runner
  should_not_load:
    - route-driven-work
    - paper-digest

- query: "参考这个网站的高级感做一个 landing page，先整理成 DESIGN.md 再开始写页面"
  should_load:
    - design-taste-frontend
  should_not_load:
    - redesign-skill
    - write-a-skill

- query: "帮我创建一个新的 skill，用来处理数据库迁移排障"
  should_load:
    - write-a-skill
  should_not_load:
    - skill-maintenance

- query: "想做一个新 skill，里面要明确任务分解、验证规则、输出格式和用户偏好"
  should_load:
    - write-a-skill
  should_not_load:
    - skill-maintenance

- query: "根据候选人简历准备一组面试追问，重点看 ownership"
  should_load:
    - engineering-interview
  should_not_load:
    - grill-me

- query: "通读 docs/p1-recommendation，看技术文档是否已经达到可编程状态，哪些需要我拍板"
  should_load:
    - programmable-doc-review
  should_not_load:
    - edit-article

- query: "这份架构方案还不够 crystal clear，帮我判断 coding agent 能不能直接开工"
  should_load:
    - programmable-doc-review
  should_not_load:
    - write-a-prd

- query: "先把这个后端服务按请求处理链路抽出来，再审计可靠性问题"
  should_load:
    - perspective-context
  should_not_load:
    - systematic-debugging

- query: "不要直接评价这个推荐系统方案，先整理成样本到线上排序的链路，再看哪里会导致效果归因失真"
  should_load:
    - perspective-context
  should_not_load:
    - programmable-doc-review
