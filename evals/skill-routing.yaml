# Seed routing examples for skill description changes.
# This file is intentionally simple YAML so it can be reviewed and expanded by hand.

- query: "帮我跑一下今天的 paper digest，并发到飞书文档后通知群里"
  should_load:
    - paper-digest
  should_not_load:
    - paper-reader
    - paper-patterns

- query: "今天的 paper digest 存到 Obsidian vault，不要再发飞书文档"
  should_load:
    - paper-digest
  should_not_load:
    - paper-reader
    - paper-patterns

- query: "这篇 arxiv 论文讲什么？2401.12345"
  should_load:
    - paper-reader
  should_not_load:
    - paper-digest
    - paper-patterns

- query: "按 PaperForge 那种方式深读这篇 paper，重点讲作者怎么想到这个 idea、最脆弱假设和反例"
  should_load:
    - paper-reader
  should_not_load:
    - paper-digest
    - paper-patterns

- query: "把这篇 paper 提炼成可迁移的 problem pattern 和 solution pattern，并写进 Research Pattern OKF"
  should_load:
    - paper-patterns
  should_not_load:
    - paper-digest
    - paper-reader

- query: "从 2401.12345 抽取 bottleneck、assumption、tradeoff 和 research question，维护到 pattern library"
  should_load:
    - paper-patterns
  should_not_load:
    - paper-digest
    - paper-reader

- query: "跑 x-feed-capture，继续上次的位置，发到飞书"
  should_load:
    - x-feed-capture
  should_not_load:
    - paper-digest

- query: "继续跑 x-capture，把结果写进 obsidian vault"
  should_load:
    - x-feed-capture
  should_not_load:
    - paper-digest

- query: "这个任务适不适合做成长程工作？如果适合生成 route.md"
  should_load:
    - long-horizon-work
  should_not_load:
    - prd-to-plan

- query: "帮我本地 validate 这个 serverless job，按真实 event contract 触发，云上的队列和存储先 adapter/mock"
  should_load:
    - local-production-validation
  should_not_load:
    - systematic-debugging

- query: "这个 long-running task 适不适合做成长程工作？先生成 route.md"
  should_load:
    - long-horizon-work
  should_not_load:
    - local-production-validation
    - deli-autoresearch

- query: "用 Deli AutoResearch protocol 跑一个多天的无人值守研究任务，要有 state files、stall detection 和 heartbeat watchdog"
  should_load:
    - deli-autoresearch
  should_not_load:
    - long-horizon-work

- query: "给这个 helper 函数补一个单测，本地跑一下"
  should_load:
    - tdd
  should_not_load:
    - local-production-validation

- query: "检查一下这个 skills 仓库，有哪些 skill 太长、description 不清楚"
  should_load:
    - skill-maintenance
  should_not_load:
    - write-a-skill

- query: "帮我创建一个新的 skill，用来处理数据库迁移排障"
  should_load:
    - write-a-skill
  should_not_load:
    - skill-maintenance

- query: "根据候选人简历准备一组面试追问，重点看 ownership"
  should_load:
    - engineering-interview
  should_not_load:
    - grill-me

- query: "通读 docs/p1-recommendation，看技术文档是否已经达到可编程状态，哪些需要我拍板"
  should_load:
    - programmable-doc-review
  should_not_load:
    - edit-article

- query: "这份架构方案还不够 crystal clear，帮我判断 coding agent 能不能直接开工"
  should_load:
    - programmable-doc-review
  should_not_load:
    - write-a-prd

- query: "先把这个后端服务按请求处理链路抽出来，再审计可靠性问题"
  should_load:
    - perspective-context
  should_not_load:
    - systematic-debugging

- query: "不要直接评价这个推荐系统方案，先整理成样本到线上排序的链路，再看哪里会导致效果归因失真"
  should_load:
    - perspective-context
  should_not_load:
    - programmable-doc-review
